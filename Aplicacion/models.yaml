# Generado por notebooks/06-modelado.ipynb. No editar a mano.
# El preprocesamiento aqui declarado es identico al del entrenamiento.
models:
  - id: cnn_simple
    name: "CNN propia (desde cero)"
    path: models/cnn_simple.keras
    framework: tensorflow
    format: keras
    input_size: [224, 224]
    color_mode: grayscale
    channels: 1
    normalization:
      type: none
    class_order: [sin_fractura, fractura]
    fracture_index: 1
    threshold: 0.5
    output_type: probability
    metrics_path: metrics/cnn_simple.json
    last_conv_layer: null
  - id: mobilenetv2
    name: "MobileNetV2 (ImageNet)"
